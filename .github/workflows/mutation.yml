name: Mutation

# Coverage says a line ran; it does not say a test would notice if the line
# were wrong. Stryker answers that by changing src/ one small edit at a time
# and checking that some test fails. The library is one file, so every run
# mutates all of it. With the Vitest runner, a run took 4.5 minutes on four
# cores (2026-10-25). It is not a required check, and it lives here, not in
# ci.yml, so that a red run does not read as a broken build.
on:
  schedule:
    # After ci.yml's weekly run, so the two do not share a queue.
    - cron: '0 8 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'vitest.config.ts'
      - 'stryker.config.mjs'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node from .nvmrc, the npm cache, `npm ci --ignore-scripts`.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@db6586f85d7ffaade83ee996799ebf8f3fe43aae # v1.3.0

      - name: Mutation test
        # Fails below the floor (thresholds.break in stryker.config.mjs).
        run: npm run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
