name: PR hygiene

# CONTRIBUTING's branch and issue rules, enforced rather than asked for. They
# lived only in prose in the repositories this was distilled from, and about
# half the merges cited no issue. A warning would have joined the prose.
#
# `edited` because fixing the description is how most failures get fixed, and
# `labeled`/`unlabeled` because `no-issue` and `no-changelog` change the
# verdict; without them a corrected pull request would stay red until its
# next push.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

# Editing a description three times in a minute is three runs; only the last
# one's verdict matters.
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only: the check reads the event payload and writes nothing back. Its
# verdict is the job's status; nothing here comments or labels.
permissions:
  contents: read
  pull-requests: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: the action reads the pull request from the event, not
      # from the tree, and a job with no checkout has nothing a branch could
      # have put there. Which is also why the Node version is written here
      # rather than read from .nvmrc; keep the two on the same major.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The pull request runs its own copy of this file, so a change to the
      # pin or the inputs below is what review looks at on a pull request that
      # touches `.github/workflows/`. The rules themselves are the action's,
      # pinned by sha; `dependabot[bot]` is exempt by author.
      - uses: Bimmiest/shared-workflows/.github/actions/pr-hygiene@3ef90f03b0c9d3b07e9ae9a1ee7005116988ffd0 # v1.5.0

      # A change to what an install receives needs a CHANGELOG line, because
      # consumers read it to decide on a bump. The paths are the shipped files
      # that can change behaviour. The label `no-changelog` exempts a change
      # that no user can see, for example a comment.
      - uses: Bimmiest/shared-workflows/.github/actions/changelog-check@3ef90f03b0c9d3b07e9ae9a1ee7005116988ffd0 # v1.5.0
        with:
          paths: src/**,build/**,pcre2.wasm,pcre2.wasm.sha256,LICENCE-PCRE2.md,NOTICE
