name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The rebuild below downloads the pinned PCRE2 release and installs clang 18
  # from the runner's apt. A weekly run notices either one going away before
  # the next change needs them.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # pcre2.wasm is committed, so this is what makes it trustworthy: rebuild it
  # from the pinned PCRE2 release with the pinned toolchain and fail unless the
  # result is byte-identical to what is checked in (and to its recorded
  # SHA-256). Then the tests, which need no install, and the type-check.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install clang and wasm-ld
        # The major version is part of the reproducibility contract; build.sh
        # names the one the committed module was built with.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-18 lld-18

      - name: Rebuild pcre2.wasm and compare with the committed module
        run: CLANG=clang-18 WASM_LD=wasm-ld-18 build/build.sh --check

      - name: Test
        run: npm test

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck
